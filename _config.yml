# Alexis Manche — al-folio v1.x
# Personal GitHub Pages site: https://alex-manche.github.io

title: blank
first_name: Alexis
middle_name:
last_name: Manche
contact_note: >
  For research collaborations, software questions, or computational materials projects, use the links below.
description: >
  Alexis Manche is a computational materials researcher working on point defects,
  electronic structure, spectroscopy and battery materials.
footer_text: >
  Built with <a href="https://github.com/alshedivat/al-folio">al-folio</a> and hosted on GitHub Pages.
keywords: computational materials chemistry, DFT, point defects, batteries, spectroscopy, VASP, phonons
lang: en
icon: ⚛️
url: https://alex-manche.github.io
baseurl:
last_updated: true
back_to_top: true

repo_theme_light: default
repo_theme_dark: dark
protect_email: false
repo_trophies:
  enabled: false
external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  features:
    cv:
      enabled: true
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

navbar_fixed: true
footer_fixed: false
search_enabled: true
socials_in_search: true
posts_in_search: false
bib_search: true
max_width: 1040px
serve_og_meta: true
serve_schema_org: true
og_image: research_hero.svg

analytics:
  google:
  cronitor:
  pirsch:
  openpanel:
  cloudflare:
enable_simple_analytics: false

collections:
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ['_pages']
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - publication_sources.json
  - vendor/
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter
  - al_email_protect
  - al_marimo
  - al_rtl

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

sass:
  style: compressed
jekyll-minifier:
  compress_javascript: false
  compress_css: false
  exclude: ['robots.txt']
terser:
  compress:
    drop_console: true

scholar:
  last_name: [Manche]
  first_name: [Alexis, A.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: '@*'
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: false
  inspirehep: false
filtered_bibtex_keywords:
  [abbr, abstract, additional_info, altmetric, annotation, arxiv, award, award_name,
   bibtex_show, blog, code, dimensions, eprint, google_scholar_id, hal, html,
   inspirehep_id, pdf, pmid, poster, preview, selected, slides, supp, video, website]
max_author_limit: 8
more_authors_animation_delay: 10
enable_publication_thumbnails: false

external_links:
  enabled: true
  rel: external noopener
  target: _blank

imagemagick:
  enabled: false
lazy_loading_images: true

enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: false
enable_progressbar: true
enable_video_embedding: false

