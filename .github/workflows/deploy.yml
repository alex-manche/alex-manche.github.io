name: Deploy site

on:
  push:
    branches: [main, master]
    paths:
      - 'assets/**'
      - '_bibliography/**'
      - '_data/**'
      - '_news/**'
      - '_pages/**'
      - '_projects/**'
      - '_sass/**'
      - '**.md'
      - '**.yml'
      - 'Gemfile'
      - '_config.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
